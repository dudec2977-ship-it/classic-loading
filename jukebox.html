<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Classic+ Club Jukebox</title>
<style>
  html, body { margin: 0; padding: 0; width: 256px; height: 144px; overflow: hidden; background: #000; }
  #player { width: 256px; height: 144px; }
</style>
</head>
<body>
<div id="player"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var vid = (params.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
  var startSec = Math.max(0, parseInt(params.get("t") || "0", 10) || 0);
  var initVol = Math.max(0, Math.min(100, parseInt(params.get("vol") || "55", 10) || 55));

  var player = null;
  var ready = false;
  var pendingVol = initVol;

  function applyVolume(pct) {
    pct = Math.max(0, Math.min(100, Math.round(pct)));
    pendingVol = pct;
    if (!ready || !player) return;
    try {
      if (pct <= 0) {
        player.mute();
        player.setVolume(0);
      } else {
        if (player.isMuted && player.isMuted()) player.unMute();
        player.setVolume(pct);
      }
    } catch (e) {}
  }

  window.__ccSetVol = function (frac) {
    applyVolume((parseFloat(frac) || 0) * 100);
  };

  if (!vid || vid.length !== 11) return;

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
      width: "256",
      height: "144",
      videoId: vid,
      playerVars: {
        autoplay: 1,
        controls: 0,
        disablekb: 1,
        fs: 0,
        iv_load_policy: 3,
        modestbranding: 1,
        playsinline: 1,
        rel: 0,
        start: startSec,
        origin: window.location.origin
      },
      events: {
        onReady: function (e) {
          ready = true;
          try {
            applyVolume(pendingVol);
            e.target.playVideo();
          } catch (err) {}
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) {
            applyVolume(pendingVol);
          }
        }
      }
    });
  };

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
